apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: newpython-backend
  namespace: storefront-dev012
  labels:
    app.kubernetes.io/name: newpython-backend
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: newpython-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
